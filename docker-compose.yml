services:
  mysql:
    image: mysql:8.4
    container_name: nexa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nexa_portal
      MYSQL_USER: nexa
      MYSQL_PASSWORD: nexa_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - nexa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nexa_mysql_data:
